<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blockly Web</title>
    <link rel="stylesheet" href="Blockly_web2.css">
</head>
<body>

    <div id="toolBox">

        <!-- ===== h1_6 ===== -->

        <select id="h1_6">

            <option value="h1" id="h1">h1 (Main Heading)</option>
            <option value="h2" id="h2">h2 (Heading)</option>
            <option value="h3" id="h3">h3</option>
            <option value="h4" id="h4">h4</option>
            <option value="h5" id="h5">h5</option>
            <option value="h6" id="h6">h6</option>

        </select>


        <!-- ===== p ===== -->
        <button type="button" value="p" id="p">p (paragraph)</button>


        <!-- ===== link ===== -->
        <button type="button" value="a" id="a">a (Link)</button>


        <!-- ===== div ===== -->
        <button type="button" value="div" id="div">div (Box)</button>


        <!-- ===== ul ===== -->
        <button type="button" value="ul" id="ul">ul (List)</button>


        <!-- ===== ol ===== -->
        <button type="button" value="ol" id="ol">ol (Numbered List)</button>


        <!-- ===== li ===== -->
        <button type="button" value="li" id="li">li (List item)</button>


        <!-- ===== button ===== -->
        <button type="button" value="button" id="button">button</button>


        <!-- ===== img ===== -->
        <button type="button" value="img" id="img">img</button>


        <!-- ===== [+] -->
        <button type="button" value="+" id="createrBtn">+</button>

    </div>


    <div id="DesignArea"></div>
    <div class="styleBox1"></div>

    <script src="Blockly_web2.js"></script>
</body>
</html>
